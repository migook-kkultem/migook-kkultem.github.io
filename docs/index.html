<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국꿀템 · 오늘의 딜</title>
<meta name="description" content="미국 한인을 위한 아마존 핫딜·꿀템. 가격 확인한 딜만 모았어요.">
<style>
  /* ============ 브랜드 색 ============ */
  :root{
    --navy:#14213D; --navy-2:#1E2F55; --honey:#FFC83D; --honey-d:#E8A800;
    --cream:#FFF6E0; --ink:#14213D; --muted:#5B6478; --line:#E9E2CF; --card:#FFFFFF;
    --bg:#FFF9EC; --hot:#E5484D;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0F1830; --card:#18264A; --ink:#F4F1E8; --muted:#A9B2C8; --line:#2A3A63; --cream:#1E2F55; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}

  /* ============ 헤더 ============ */
  header{background:var(--navy);color:#fff;text-align:center;padding:28px 16px 22px;border-radius:0 0 24px 24px}
  .logo{width:84px;height:84px;border-radius:50%;background:var(--navy-2);border:3px solid var(--honey);
        display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 10px}
  .logo small{font-size:9px;letter-spacing:2px;color:#fff;opacity:.9}
  .logo b{font-size:26px;color:var(--honey);line-height:1.1}
  header h1{font-size:20px;font-weight:800}
  header p{font-size:13px;opacity:.85;margin-top:2px}
  .ig{display:inline-block;margin-top:10px;font-size:13px;color:var(--honey);text-decoration:none;font-weight:700}

  /* ============ 공지 / 필터 ============ */
  .disclose{font-size:11.5px;color:var(--muted);background:var(--cream);border:1px solid var(--line);
            border-radius:12px;padding:10px 12px;margin:16px 0 12px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;
        font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
  .chip.on{background:var(--honey);border-color:var(--honey);color:var(--navy)}

  /* ============ 카드 ============ */
  .list{display:flex;flex-direction:column;gap:12px}
  .card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:14px;text-decoration:none;color:inherit;transition:transform .1s}
  .card:active{transform:scale(.98)}
  .card.has-pic{flex-direction:column;padding:0;overflow:hidden}
  .card.has-pic .body{padding:12px 14px 14px}
  .pic{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;background:var(--cream)}
  .emo{flex:none;width:56px;height:56px;border-radius:14px;background:var(--cream);display:flex;
       align-items:center;justify-content:center;font-size:30px}
  .body{flex:1;min-width:0}
  .badges{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--cream);color:var(--muted)}
  .badge.hot{background:var(--hot);color:#fff}
  .badge.low{background:var(--honey);color:var(--navy)}
  .name{font-size:15px;font-weight:800;line-height:1.3}
  .note{font-size:12.5px;color:var(--muted);margin-top:3px}
  .row{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap}
  .price{font-size:18px;font-weight:900}
  .was{font-size:12.5px;color:var(--muted);text-decoration:line-through}
  .asof{font-size:11px;color:var(--muted);margin-left:auto}
  .go{display:block;margin-top:10px;text-align:center;background:var(--navy);color:#fff;font-weight:800;
      font-size:13.5px;padding:9px;border-radius:10px}
  @media (prefers-color-scheme: dark){ .go{background:var(--honey);color:var(--navy)} }
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:28px}
</style>
</head>
<body>

<header>
  <div class="logo"><small>MIGOOK</small><b>꿀템</b></div>
  <h1>미국꿀템 · 오늘의 딜</h1>
  <p>미국 한인을 위한 아마존 핫딜·꿀템 🇺🇸🇰🇷</p>
  <a class="ig" href="https://instagram.com/migook.kkultem">@migook.kkultem 팔로우 →</a>
</header>

<main class="wrap">
  <div class="disclose">
    📢 이 페이지는 아마존 제휴 링크를 포함하고 있어요. 링크로 구매하시면 추가 비용 없이 소정의 수수료를 받습니다.
    가격은 표시된 시점 기준이며 수시로 바뀔 수 있어요.<br>
    As an Amazon Associate I earn from qualifying purchases.
  </div>

  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>

  <footer>
    가격·재고는 아마존 사이트 기준으로 최종 확인해 주세요.<br>
    © 미국꿀템
  </footer>
</main>

<script>
/* =========================================================
   ✏️ 여기만 수정하세요
   1) TAG 에 본인 Amazon Associates 트래킹 ID 입력
   2) DEALS 에 딜 추가/삭제 — 위에 있을수록 페이지 상단에 표시
      ends 날짜가 지나면 자동으로 숨겨져요 (YYYY-MM-DD, 비우면 계속 표시)
   3) img: 우리 슬라이드에서 자른 이미지 (img/deal-<ASIN>.jpg, 3:2). 아마존 상품 사진은 사용 금지. 비우면 이모지 표시
   ========================================================= */
const TAG = "migookkkultem-20";

const DEALS = [
  /* ===== 🎃 할로윈 (10/31 지나면 자동 숨김) ===== */
  { asin:"B088CY6B1V", img:"img/deal-B088CY6B1V.jpg", emoji:"💀", cat:"할로윈",
    name:"해골 LED 캔들 (6시간 타이머)",
    note:"불 없이 안전한 할로윈 무드 · 1년 내내 $19~26 → 최근 1년 최저 수준",
    price:"$16.99", was:"$19.99", asof:"10/18 밤", badge:"최저가 근접", ends:"2026-10-31" },
  { asin:"B0CXTZKZ1S", img:"img/deal-B0CXTZKZ1S.jpg", emoji:"🍫", cat:"할로윈",
    name:"M&M's·스니커즈 할로윈 펀사이즈 195개",
    note:"트릭오어트릿 사탕 · 개당 약 13¢ · 올해 대부분 $30~43 → 작년 할로윈 최저와 같은 가격",
    price:"$24.87", was:"", asof:"10/18 밤", badge:"최저가 근접", ends:"2026-10-31" },
  { asin:"B07VKYG68N", img:"img/deal-B07VKYG68N.jpg", emoji:"🦇", cat:"할로윈",
    name:"할로윈 창문 스티커 10장",
    note:"떼었다 붙였다 · 아이랑 같이 꾸미기 · 1년 내내 $6.99",
    price:"$5.99", was:"$6.99", asof:"10/18 밤", badge:"최저가 근접", ends:"2026-10-31" },
  { asin:"B003NT5KRI", img:"img/deal-B003NT5KRI.jpg", emoji:"🩻", cat:"할로윈",
    name:"Beistle 해골 문 커버 5ft",
    note:"화장실·현관문 데코 · 리뷰 1.2만+ · 평소 $7~8",
    price:"$6.07", was:"$7.20", asof:"10/18 밤", badge:"최저가 근접", ends:"2026-10-31" },
  { asin:"B00N1QPNMA", img:"img/deal-B00N1QPNMA.jpg", emoji:"✨", cat:"할로윈",
    name:"야광봉 100개 (팔찌·목걸이 연결)",
    note:"트릭오어트릿 밤길 안전 · 리뷰 2.9만 · 평소 가격 그대로",
    price:"$7.99", was:"", asof:"10/18 밤", badge:"꿀템", ends:"2026-10-31" },

  /* ===== 기존 딜 (10/18 밤 가격 재확인) ===== */
  { asin:"B0BRYCXRPG", img:"img/deal-B0BRYCXRPG.jpg", emoji:"💊", cat:"건강",
    name:"Physician's CHOICE 유산균 60B CFU 84캡슐",
    note:"약 3개월분 · 최근 1년 최저가 (평소 $45~50)",
    price:"$34.97", was:"$49.97", asof:"10/18 밤", badge:"핫딜", ends:"" },
  { asin:"B0GVL6RB6Z", img:"img/deal-B0GVL6RB6Z.jpg", emoji:"🥟", cat:"주방",
    name:"닌자 푸드프로세서 + 반죽기 9컵 (BZ601)",
    note:"만두소·김치 양념·반죽 · 가격 추적 5개월 중 최저가",
    price:"$99.99", was:"$118.74", asof:"10/18 밤", badge:"최저가", ends:"" },
  { asin:"B0C4M2D1J2", img:"img/deal-B0C4M2D1J2.jpg", emoji:"🍲", cat:"주방",
    name:"크록팟 7쿼트 슬로우쿠커 (수비드)",
    note:"갈비찜·수육 · 역대 최저 $99.98에 근접",
    price:"$104.32", was:"$138.13", asof:"10/18 밤", badge:"최저가 근접", ends:"" },
  { asin:"B0BZHG5VQL", img:"img/deal-B0BZHG5VQL.jpg", emoji:"🍳", cat:"정착템",
    name:"센사르테 세라믹 냄비·팬 13종 세트",
    note:"미국 첫 살림 · 역대 최저 $62.65에 근접",
    price:"$65.94", was:"$77.99", asof:"10/18 밤", badge:"최저가 근접", ends:"" },
  { asin:"B091FXQQMQ", img:"img/deal-B091FXQQMQ.jpg", emoji:"🔌", cat:"생활",
    name:"카사 스마트플러그 미니 2개입",
    note:"가습기·조명 앱으로 켜고 끄기 · 평균 $16.58",
    price:"$13.95", was:"$16.58", asof:"10/18 밤", badge:"꿀템", ends:"" },
];
/* badge 예시: "핫딜" (빨강) · "최저가" (노랑) · 그 외 텍스트는 기본 회색 */
/* ========================================================= */

const CATS = ["전체", ...new Set(DEALS.map(d => d.cat))];
let current = "전체";
const today = new Date(); today.setHours(0,0,0,0);

function live(d){ return !d.ends || new Date(d.ends + "T23:59:59") >= today; }
function link(d){ return "https://www.amazon.com/dp/" + d.asin + "?tag=" + encodeURIComponent(TAG); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function badgeClass(b){ return b === "핫딜" ? "badge hot" : b === "최저가" ? "badge low" : "badge"; }

function renderChips(){
  document.getElementById("chips").innerHTML = CATS.map(c =>
    `<button class="chip ${c===current?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { current = b.dataset.c; renderChips(); renderList(); });
}
function renderList(){
  const items = DEALS.filter(live).filter(d => current === "전체" || d.cat === current);
  document.getElementById("list").innerHTML = items.length ? items.map(d => `
    <a class="card${d.img ? " has-pic" : ""}" href="${link(d)}" target="_blank" rel="sponsored noopener">
      ${d.img ? `<img class="pic" src="${esc(d.img)}" alt="${esc(d.name)}" loading="lazy" width="720" height="480">`
              : `<div class="emo">${esc(d.emoji)}</div>`}
      <div class="body">
        <div class="badges"><span class="${badgeClass(d.badge)}">${esc(d.badge)}</span><span class="badge">${esc(d.cat)}</span></div>
        <div class="name">${esc(d.name)}</div>
        <div class="note">${esc(d.note)}</div>
        <div class="row">
          <span class="price">${esc(d.price)}</span>
          ${d.was ? `<span class="was">${esc(d.was)}</span>` : ""}
          ${d.asof ? `<span class="asof">${esc(d.asof)} 기준</span>` : ""}
        </div>
        <span class="go">아마존에서 보기 →</span>
      </div>
    </a>`).join("") : `<div class="empty">지금은 진행 중인 딜이 없어요 🙏<br>인스타 스토리를 확인해 주세요!</div>`;
}
renderChips(); renderList();
</script>
</body>
</html>
